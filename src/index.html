<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/widget.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/controls.css">
  <link rel="stylesheet" href="styles/sleeve.css">
  <link rel="stylesheet" href="styles/glass.css">
  <link rel="stylesheet" href="styles/record.css">
  <link rel="stylesheet" href="styles/mini.css">
  <link rel="stylesheet" href="styles/ui.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <div id="widget" data-state="idle">
    <div id="deck">
      <div id="leftPane">
        <div id="meta">
          <div id="title">Desktop audio session</div>
          <div id="album"><span id="albumText">Album unknown</span></div>
          <div id="artist">Waiting for media</div>
        </div>
        <div id="status" data-state="idle">LISTENING</div>
        <div id="controls">
          <div id="transport" aria-label="Playback controls">
            <button id="btnPrev" class="mediaBtn" type="button" aria-label="Previous track" title="Previous">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3 6 9-6v12z"/></svg>
            </button>
            <button id="btnPlayPause" class="mediaBtn" type="button" aria-label="Play or pause" title="Play">
              <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12l10-6z"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h4v12H7zm6 0h4v12h-4z"/></svg>
            </button>
            <button id="btnNext" class="mediaBtn" type="button" aria-label="Next track" title="Next">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM7 6l9 6-9 6z"/></svg>
            </button>
          </div>
          <button id="btnSettings" class="utilityBtn" type="button" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.3"/>
              <circle cx="12" cy="12" r="7.2"/>
              <line x1="12" y1="1.8" x2="12" y2="4.6"/>
              <line x1="12" y1="19.4" x2="12" y2="22.2"/>
              <line x1="1.8" y1="12" x2="4.6" y2="12"/>
              <line x1="19.4" y1="12" x2="22.2" y2="12"/>
              <line x1="4.6" y1="4.6" x2="6.6" y2="6.6"/>
              <line x1="17.4" y1="17.4" x2="19.4" y2="19.4"/>
              <line x1="17.4" y1="6.6" x2="19.4" y2="4.6"/>
              <line x1="4.6" y1="19.4" x2="6.6" y2="17.4"/>
            </svg>
          </button>
          <div id="sourceKnob" class="knob" aria-hidden="true" title="Audio source"></div>
        </div>
        <div id="frame">
          <canvas id="c"></canvas>
        </div>
      </div>

      <div id="rightPane">
        <div id="sleeve">
          <img id="sleeveArtNew" alt="" aria-hidden="true">
          <img id="sleeveArt" alt="Album sleeve art">
        </div>
      </div>
      <div id="sleeveSlot" aria-hidden="true"></div>

      <!-- Record is a direct deck child so it moves independently of the grid -->
      <div id="record">
        <img id="recordArtNew" alt="" aria-hidden="true">
        <img id="recordArt" alt="Record art">
        <div id="recordGrooves"></div>
        <div id="recordBurn" aria-hidden="true"></div>
        <div id="recordLabel">
          <div id="labelTopText">Stereo 45 RPM</div>
          <div id="labelSideText">Side A</div>
          <div id="labelTitle">Unknown Track</div>
          <div id="labelArtist">Unknown Artist</div>
          <div id="labelCatalog">CAT-1029</div>
        </div>
        <div id="spindle"></div>
      </div>

      <div id="armMount"></div>
      <div id="tonearm">
        <div id="needle"></div>
      </div>
      <div id="powerLight" aria-hidden="true"></div>
    </div>
    <div id="miniPane" aria-hidden="true">
      <div id="miniArtWrap">
        <img id="miniArt" alt="Mini album art">
        <canvas id="miniSpectrum" aria-hidden="true"></canvas>
      </div>
      <div id="miniContent">
        <div id="miniTitle">Unknown Track</div>
        <div id="miniArtist">Unknown Artist</div>
        <div id="miniProgress"><div id="miniProgressFill"></div></div>
        <div id="miniControls" aria-label="Mini controls">
          <button id="btnPrevMini" class="miniBtn" type="button" aria-label="Previous track" title="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3 6 9-6v12z"/></svg>
          </button>
          <button id="btnPlayPauseMini" class="miniBtn" type="button" aria-label="Play or pause" title="Play">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12l10-6z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h4v12H7zm6 0h4v12h-4z"/></svg>
          </button>
          <button id="btnNextMini" class="miniBtn" type="button" aria-label="Next track" title="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM7 6l9 6-9 6z"/></svg>
          </button>
          <button id="btnMiniCollapse" class="miniBtn" type="button" aria-label="Return to collapsed record player view" title="Collapsed record player view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v2H6v5H4zm13 0h3v7h-2V6h-5V4zM4 13h2v5h5v2H4zm14 0h2v7h-7v-2h5z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <canvas id="glassSpectrum" aria-hidden="true"></canvas>
    <button id="glassMenuBtn" class="utilityBtn" type="button" aria-label="More options" title="More options">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/></svg>
    </button>
    <button id="pinBtn" type="button" aria-label="Pin widget" title="Pin widget" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>
    </button>
    <div id="glassQuickMenu" aria-hidden="true">
      <button id="quickMini" class="quickItem" type="button">Mini Player</button>
      <button id="quickSettings" class="quickItem" type="button">Settings</button>
    </div>
    <div id="glassMeta" aria-hidden="true">
      <div id="glassTitle">Unknown Track</div>
      <div id="glassArtist">Unknown Artist</div>
      <div id="glassAlbum">Album unknown</div>
    </div>
    <div id="glassControls" aria-label="Playback controls">
      <div id="glassTransport" aria-label="Playback controls">
        <button id="btnPrevGlass" class="mediaBtn glassBtn" type="button" aria-label="Previous track" title="Previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3 6 9-6v12z"/></svg>
        </button>
        <button id="btnPlayPauseGlass" class="mediaBtn glassBtn" type="button" aria-label="Play or pause" title="Play">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12l10-6z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h4v12H7zm6 0h4v12h-4z"/></svg>
        </button>
        <button id="btnNextGlass" class="mediaBtn glassBtn" type="button" aria-label="Next track" title="Next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM7 6l9 6-9 6z"/></svg>
        </button>
      </div>
    </div>
    <div id="glassVolumeDock">
      <div id="volumeWrap">
        <button id="volumeBtnGlass" class="mediaBtn glassBtn" type="button" aria-label="Volume" title="Volume">
          <svg class="icon-volume" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 4V6l-4 4zM15.5 9.4a1 1 0 0 1 1.4 0 4.5 4.5 0 0 1 0 6.4 1 1 0 0 1-1.4-1.4 2.5 2.5 0 0 0 0-3.6 1 1 0 0 1 0-1.4z"/></svg>
          <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 4V6l-4 4zM15.2 9.8l4.5 4.5-1.4 1.4-4.5-4.5zm0 5.9 4.5-4.5-1.4-1.4-4.5 4.5z"/></svg>
        </button>
        <div id="volumePopup" aria-hidden="true">
          <input id="sourceVolumeGlass" type="range" min="0" max="100" step="1" value="50" aria-label="System volume" title="System volume">
        </div>
      </div>
    </div>
    <div id="settingsPanel" aria-hidden="true" data-open="false">
      <div id="settingsHeader">⚙ SETTINGS</div>
      <div class="settingsDivider"></div>
      <div class="settingsRow settingsRow--theme">
        <label>Theme</label>
        <div id="themeSelect" class="themePills">
          <button class="themePill" data-value="light" type="button">Light</button>
          <button class="themePill" data-value="dark" type="button">Dark</button>
          <button class="themePill" data-value="cream" type="button">Cream</button>
          <button class="themePill" data-value="pastel" type="button">Pastel</button>
          <button class="themePill" data-value="transparent" type="button">Trans</button>
        </div>
      </div>
      <div class="settingsDivider"></div>
      <div class="settingsRow settingsRow--record">
        <label>Record (Expanded)</label>
        <div id="recordSelect" class="recordPills">
          <button class="recordPill" data-value="album" type="button">Art</button>
          <button class="recordPill" data-value="black" type="button">Black</button>
          <button class="recordPill" data-value="white" type="button">White</button>
          <button class="recordPill" data-value="transparent" type="button">Trans</button>
        </div>
      </div>
      <div class="settingsRow settingsRow--record">
        <label>Record (Lid)</label>
        <div id="recordLidSelect" class="recordPills">
          <button class="recordPill" data-value="album" type="button">Art</button>
          <button class="recordPill" data-value="black" type="button">Black</button>
          <button class="recordPill" data-value="white" type="button">White</button>
          <button class="recordPill" data-value="transparent" type="button">Trans</button>
        </div>
      </div>
      <div class="settingsRow">
        <label for="scaleSlider">Scale</label>
        <input id="scaleSlider" type="range" min="70" max="135" step="1" value="100">
      </div>
      <div class="settingsRow">
        <label for="clearGlassToggle">Clear Glass</label>
        <input id="clearGlassToggle" type="checkbox" checked>
      </div>
      <div class="settingsRow">
        <label for="launchToggle">Launch On Startup</label>
        <input id="launchToggle" type="checkbox">
      </div>
      <div class="settingsRow">
        <label for="miniModeToggle">Mini Mode</label>
        <input id="miniModeToggle" type="checkbox">
      </div>
      <div class="settingsDivider"></div>
      <div class="settingsRow">
        <button id="btnCloseApp" class="settingsAction" type="button">Close App</button>
      </div>
    </div>
    <div id="resizeHandle" aria-hidden="true"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
