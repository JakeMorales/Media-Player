<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; min-height: 100vh; }
    canvas { display: block; width: 100%; height: 100%; }

    :root {
      --metal-1: #f2f4f7;
      --metal-2: #d2d8e1;
      --metal-3: #a8b2c1;
      --ink-1: #111721;
      --ink-2: #4b5a72;
      --label-base-rgb: 246, 223, 24;
      --label-ring-rgb: 215, 72, 54;
      --label-ink-rgb: 20, 24, 35;
      --label-panel-rgb: 255, 248, 216;
      --source-knob-angle: 18deg;
      --source-volume-pct: 50%;
      --source-accent: #6f8199;
      --arc-bounce-y: 0;
      --arc-spread: 0;
      --arc-shift-x: 0px;
      --arc-opacity: 0.48;
    }

    #widget {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 600px;
      height: 280px;
      padding: 0;
      border: 1px solid rgba(132, 142, 156, 0.8);
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0) 45%),
        repeating-linear-gradient(100deg, rgba(255, 255, 255, 0.08) 0px, rgba(255, 255, 255, 0.08) 2px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0) 7px),
        linear-gradient(165deg, var(--metal-1), var(--metal-2) 52%, #bfc8d7 100%);
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.92),
        inset 0 -1px 0 rgba(112, 124, 142, 0.35);
      pointer-events: none;
      overflow: hidden;
      transition: width 620ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 620ms ease;
    }

    #widget::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 88% 10%, rgba(255, 255, 255, 0.34) 0 20%, rgba(255, 255, 255, 0.1) 36%, rgba(255, 255, 255, 0) 60%),
        linear-gradient(218deg, rgba(255, 255, 255, 0.16) 6%, rgba(255, 255, 255, 0.07) 28%, rgba(255, 255, 255, 0) 54%),
        linear-gradient(180deg, rgba(188, 210, 234, 0.14), rgba(102, 128, 158, 0.08));
      box-shadow:
        inset 0 0 0 1px rgba(218, 234, 250, 0.4),
        inset 0 10px 20px rgba(255, 255, 255, 0.07),
        inset 0 -12px 22px rgba(56, 76, 102, 0.12);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #glassMeta {
      position: absolute;
      left: 14px;
      top: 12px;
      max-width: min(72%, 260px);
      display: grid;
      gap: 2px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-6px);
      z-index: 22;
      transition: opacity 260ms ease, transform 360ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #glassTitle {
      color: rgba(34, 60, 95, 0.95);
      font: 700 13px/1.2 "Segoe UI", sans-serif;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    #glassArtist {
      color: rgba(46, 74, 108, 0.9);
      font: 600 11px/1.25 "Segoe UI", sans-serif;
      letter-spacing: 0.15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.38);
    }

    #glassAlbum {
      color: rgba(58, 88, 122, 0.88);
      font: 600 10px/1.2 "Segoe UI", sans-serif;
      letter-spacing: 0.14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.34);
    }

    #deck {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: stretch;
      gap: 0;
      height: 100%;
      overflow: visible;
      position: relative;
      transition: grid-template-columns 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #leftPane {
      min-width: 0;
      padding: 14px 16px 12px 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.46), rgba(224, 231, 240, 0.28));
      position: relative;
      z-index: 1;
      transition: transform 620ms cubic-bezier(0.23, 1, 0.32, 1), opacity 520ms ease, padding 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #meta {
      width: calc(100% - 76px);
      max-width: calc(100% - 76px);
      min-width: 0;
      display: grid;
      gap: 4px;
      transition: opacity 420ms ease, transform 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #title {
      color: var(--ink-1);
      font: 700 20px/1.2 "Segoe UI", sans-serif;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
      white-space: normal;
      overflow-wrap: anywhere;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    #title[data-link="true"],
    #artist[data-link="true"],
    #album[data-link="true"],
    #glassTitle[data-link="true"],
    #glassArtist[data-link="true"],
    #glassAlbum[data-link="true"] {
      cursor: pointer;
      text-decoration: none;
    }

    #artist {
      color: var(--ink-2);
      font: 600 15px/1.35 "Segoe UI", sans-serif;
      margin-top: 52px;
      white-space: normal;
      overflow-wrap: anywhere;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    #album {
      color: rgba(58, 70, 90, 0.88);
      font: 600 12px/1.25 "Segoe UI", sans-serif;
      display: block;
      width: min(100%, 168px);
      max-width: 168px;
      min-width: 0;
      padding-right: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      --album-scroll-target: 0px;
      --album-scroll-duration: 4s;
    }

    #albumText {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: top;
      transform: translateX(0);
      will-change: transform;
    }

    #album.can-scroll:hover {
      text-overflow: clip;
    }

    #album.can-scroll:hover #albumText {
      overflow: visible;
      text-overflow: clip;
      animation: albumMarquee var(--album-scroll-duration) linear infinite alternate;
    }

    @keyframes albumMarquee {
      from { transform: translateX(0); }
      to { transform: translateX(var(--album-scroll-target)); }
    }

    #status {
      display: none;
      font-family: monospace;
      font-size: 10px;
      letter-spacing: 1px;
      padding: 5px 8px;
      border: 1px solid rgba(92, 106, 128, 0.45);
      border-radius: 999px;
      color: #2f4058;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(217, 224, 235, 0.92));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.88), 0 1px 2px rgba(0, 0, 0, 0.08);
      margin-top: 10px;
      width: max-content;
    }

    #status[data-state="active"] {
      border-color: rgba(16, 163, 98, 0.68);
      color: rgba(14, 111, 68, 0.95);
      background: rgba(226, 247, 236, 0.98);
    }

    #controls {
      display: flex;
      gap: 12px;
      margin-top: auto;
      margin-bottom: 6px;
      align-items: center;
      transition: opacity 420ms ease, transform 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #transport {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #glassControls {
      position: absolute;
      left: 50%;
      top: 50%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 16px;
      border: 1px solid rgba(202, 222, 243, 0.2);
      background:
        linear-gradient(138deg, rgba(255, 255, 255, 0.1), rgba(208, 226, 244, 0.06) 54%, rgba(152, 179, 208, 0.04)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(109, 139, 173, 0.03));
      box-shadow:
        inset 0 0 0 1px rgba(234, 245, 255, 0.12),
        inset 0 5px 10px rgba(255, 255, 255, 0.03),
        inset 0 -8px 14px rgba(58, 82, 112, 0.06),
        0 8px 18px rgba(12, 23, 40, 0.12);
      backdrop-filter: blur(8px) saturate(1.02);
      -webkit-backdrop-filter: blur(8px) saturate(1.02);
      z-index: 23;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(0.92);
      transition: opacity 260ms ease, transform 320ms cubic-bezier(0.23, 1, 0.32, 1);
      opacity: 0;
      pointer-events: none;
    }

    #widget[data-view="lid"]:hover #glassControls {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    #glassTransport {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .mediaBtn {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(101, 114, 134, 0.58);
      background:
        conic-gradient(from 16deg, #c9d2de, #a9b4c5, #e8edf5, #9ca8bc, #c9d2de),
        radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.94), rgba(163, 176, 196, 0.96));
      color: rgba(34, 45, 61, 0.92);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1px rgba(94, 106, 124, 0.5), 0 3px 7px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.78);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      padding: 0;
    }

    .glassBtn {
      border-color: rgba(174, 199, 226, 0.62);
      background:
        radial-gradient(circle at 28% 24%, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0.08) 40%, rgba(0, 0, 0, 0) 70%),
        linear-gradient(160deg, rgba(248, 254, 255, 0.15), rgba(157, 189, 220, 0.1));
      color: rgba(28, 48, 72, 0.95);
      box-shadow:
        inset 0 0 0 1px rgba(232, 245, 255, 0.16),
        inset 0 4px 8px rgba(255, 255, 255, 0.03),
        0 4px 10px rgba(13, 27, 44, 0.12);
      width: 34px;
      height: 34px;
    }

    .mediaBtn svg {
      width: 12px;
      height: 12px;
      fill: rgba(36, 49, 67, 0.95);
      display: block;
      pointer-events: none;
    }

    .glassBtn svg {
      fill: rgba(33, 55, 80, 0.98);
    }

    #btnPlayPause .icon-pause,
    #btnPlayPauseGlass .icon-pause { display: none; }
    #btnPlayPause[data-playing="true"] .icon-play,
    #btnPlayPauseGlass[data-playing="true"] .icon-play { display: none; }
    #btnPlayPause[data-playing="true"] .icon-pause,
    #btnPlayPauseGlass[data-playing="true"] .icon-pause { display: block; }

    .mediaBtn:active {
      transform: translateY(1px);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .glassBtn:active {
      box-shadow: inset 0 2px 6px rgba(38, 69, 101, 0.24), 0 1px 2px rgba(0, 0, 0, 0.16);
    }

    .mediaBtn:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
    }

    .knob {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background:
        conic-gradient(from 15deg, #c8cfda, #a8b2c1, #e6ebf3, #9ba6b7, #c8cfda),
        radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.9), rgba(160, 172, 191, 0.95));
      box-shadow: 0 0 0 1px rgba(95, 107, 126, 0.55), 0 3px 7px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.78);
      position: relative;
    }

    .knob::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 4px;
      width: 2px;
      height: 8px;
      margin-left: -1px;
      background: var(--source-accent);
      border-radius: 2px;
      transform: rotate(var(--source-knob-angle));
      transform-origin: center 7px;
    }

    #sourceKnob {
      box-shadow: 0 0 0 1px rgba(95, 107, 126, 0.55), 0 3px 7px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.78), 0 0 8px color-mix(in srgb, var(--source-accent) 24%, transparent);
      position: relative;
      cursor: ns-resize;
    }

    #sourceKnob::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      margin-top: -3px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--source-accent) 74%, #d9e1ea);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55);
    }

    #volumeWrap {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 34px;
      height: 34px;
    }

    #glassVolumeDock {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 24;
      transform: scale(0.92);
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms ease, transform 300ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #widget[data-view="lid"]:hover #glassVolumeDock {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    #volumeWrap::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 100%;
      width: 26px;
      height: 12px;
      transform: translateX(-50%);
    }

    #volumeBtnGlass {
      position: relative;
      z-index: 2;
    }

    #volumeBtnGlass .icon-muted { display: none; }
    #volumeBtnGlass[data-muted="true"] .icon-volume { display: none; }
    #volumeBtnGlass[data-muted="true"] .icon-muted { display: block; }

    #volumePopup {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 2px);
      transform: translate(-50%, 6px) scale(0.92);
      width: 44px;
      height: 94px;
      padding: 8px 6px;
      border-radius: 12px;
      border: 1px solid rgba(197, 221, 245, 0.24);
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.11), rgba(170, 200, 228, 0.07));
      box-shadow:
        inset 0 0 0 1px rgba(236, 247, 255, 0.12),
        0 7px 15px rgba(12, 25, 44, 0.12);
      backdrop-filter: blur(8px) saturate(1.02);
      -webkit-backdrop-filter: blur(8px) saturate(1.02);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 300ms cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 3;
    }

    #volumeWrap:hover #volumePopup {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
    }

    #sourceVolumeGlass {
      -webkit-appearance: none;
      appearance: none;
      width: 72px;
      height: 18px;
      background: transparent;
      outline: none;
      cursor: ns-resize;
      display: block;
      margin: 0;
      transform: translateX(-1px) rotate(-90deg);
      transform-origin: center;
    }

    #sourceVolumeGlass::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: 999px;
      border: 1px solid rgba(174, 200, 226, 0.42);
      background:
        linear-gradient(90deg,
          rgba(255, 255, 255, 0.95) 0,
          rgba(255, 255, 255, 0.95) var(--source-volume-pct),
          rgba(255, 255, 255, 0.24) var(--source-volume-pct),
          rgba(255, 255, 255, 0.24) 100%);
      box-shadow: inset 0 1px 2px rgba(31, 48, 71, 0.12), inset 0 -1px 0 rgba(255, 255, 255, 0.34);
    }

    #sourceVolumeGlass::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      margin-top: -5px;
      border-radius: 999px;
      border: 1px solid rgba(172, 196, 220, 0.62);
      background:
        radial-gradient(circle at 28% 28%, rgba(255, 255, 255, 0.8), rgba(227, 244, 255, 0.24) 44%, rgba(149, 183, 215, 0.28));
      box-shadow: 0 2px 5px rgba(17, 31, 48, 0.2), inset 0 0 0 1px rgba(238, 249, 255, 0.44);
    }

    #frame {
      margin-top: 6px;
      height: 52px;
      border: 0;
      border-radius: 0;
      margin-right: 70px;
      background: transparent;
      overflow: hidden;
      transition: opacity 420ms ease, transform 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #rightPane {
      position: relative;
      height: 100%;
      overflow: visible;
      z-index: 4;
      transition: border-radius 620ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 620ms ease;
    }

    #rightPane::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(246, 250, 255, 0.92), rgba(219, 230, 243, 0.9));
      border-radius: 0 13px 13px 0;
      box-shadow:
        inset 0 0 0 1px rgba(186, 201, 220, 0.52),
        inset 0 -8px 16px rgba(103, 124, 151, 0.14);
      transform: translateX(-34%);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: transform 620ms cubic-bezier(0.23, 1, 0.32, 1), opacity 620ms ease;
    }

    #rightPane::before {
      content: "";
      position: absolute;
      left: -400px;
      top: 0;
      width: 400px;
      height: 100%;
      background:
        repeating-radial-gradient(
          circle at 100% 50%,
          rgba(154, 168, 186, 0.35) 0px,
          rgba(154, 168, 186, 0.35) 1px,
          rgba(0, 0, 0, 0) 1px,
          rgba(0, 0, 0, 0) 10px
        );
      -webkit-mask-image: linear-gradient(to left, rgba(0, 0, 0, 0.96) 12%, rgba(0, 0, 0, 0.58) 48%, rgba(0, 0, 0, 0.18) 76%, rgba(0, 0, 0, 0) 100%);
      mask-image: linear-gradient(to left, rgba(0, 0, 0, 0.96) 12%, rgba(0, 0, 0, 0.58) 48%, rgba(0, 0, 0, 0.18) 76%, rgba(0, 0, 0, 0) 100%);
      transform-origin: 100% 50%;
      transform: translateX(calc(var(--arc-shift-x) * -1)) scaleX(calc(1 + var(--arc-spread))) scaleY(calc(1 + var(--arc-bounce-y)));
      opacity: var(--arc-opacity);
      pointer-events: none;
      z-index: 0;
    }

    #widget[data-draggable="true"] {
      pointer-events: auto;
      cursor: grab;
    }

    #widget[data-dragging="true"] {
      cursor: grabbing;
    }

    #sleeve {
      position: absolute;
      inset: 0;
      border-radius: 0 13px 13px 0;
      border-left: 1px solid rgba(114, 126, 145, 0.6);
      background: linear-gradient(180deg, rgba(232, 238, 247, 0.98), rgba(206, 217, 231, 0.96));
      box-shadow: inset 8px 0 12px rgba(60, 72, 94, 0.16);
      overflow: hidden;
      z-index: 3;
      transition: background 620ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 620ms cubic-bezier(0.23, 1, 0.32, 1), border-color 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #sleeve::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 0;
      bottom: 0;
      width: 20px;
      background: linear-gradient(90deg, rgba(72, 84, 105, 0.42), rgba(255, 255, 255, 0));
      z-index: 5;
      pointer-events: none;
      transition: opacity 520ms ease;
    }

    #sleeve::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(132deg, rgba(255, 255, 255, 0.42) 8%, rgba(255, 255, 255, 0.1) 36%, rgba(255, 255, 255, 0) 60%),
        linear-gradient(180deg, rgba(186, 206, 226, 0.34), rgba(92, 116, 142, 0.2));
      box-shadow: inset 0 0 0 1px rgba(211, 226, 243, 0.42), inset 0 10px 24px rgba(255, 255, 255, 0.1), inset 0 -14px 24px rgba(48, 64, 86, 0.16);
      opacity: 0;
      pointer-events: none;
      z-index: 6;
      transition: opacity 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #sleeveArt {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.02) contrast(1.04);
      transition: opacity 620ms cubic-bezier(0.23, 1, 0.32, 1), filter 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #widget[data-view="lid"] {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.06) 45%),
        linear-gradient(165deg, rgba(235, 242, 251, 0.74), rgba(199, 214, 232, 0.7) 52%, rgba(176, 194, 217, 0.66) 100%);
      box-shadow:
        0 14px 24px rgba(0, 0, 0, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        inset 0 -1px 0 rgba(112, 124, 142, 0.24);
    }

    #widget[data-view="lid"]::after {
      opacity: 0.42;
    }

    #widget[data-view="lid"] #glassMeta {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #widget[data-view="lid"] #deck {
      grid-template-columns: 0fr minmax(0, 1fr);
    }

    #widget[data-view="lid"] #leftPane {
      opacity: 0.98;
      transform: translateX(124%);
      padding-left: 0;
      padding-right: 0;
      pointer-events: none;
    }

    #widget[data-view="lid"] #meta,
    #widget[data-view="lid"] #controls,
    #widget[data-view="lid"] #frame {
      opacity: 0.86;
      transform: translateX(42px);
    }

    #widget[data-view="lid"] #rightPane {
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px rgba(171, 189, 209, 0.34);
    }

    #widget[data-view="lid"] #rightPane::after {
      transform: translateX(0);
      opacity: 1;
    }

    #widget[data-view="lid"] #sleeve {
      border-left-color: rgba(204, 220, 238, 0.42);
      background: linear-gradient(180deg, rgba(236, 244, 253, 0.42), rgba(188, 208, 230, 0.38));
      box-shadow: inset 0 0 0 1px rgba(216, 232, 248, 0.52), inset 0 14px 28px rgba(255, 255, 255, 0.1), inset 0 -14px 24px rgba(64, 84, 112, 0.12);
    }

    #widget[data-view="lid"] #sleeve::before {
      opacity: 0;
    }

    #widget[data-view="lid"] #sleeve::after {
      opacity: 1;
      background:
        radial-gradient(circle at 86% 10%, rgba(255, 255, 255, 0.34) 0 24%, rgba(255, 255, 255, 0.12) 40%, rgba(255, 255, 255, 0) 66%),
        linear-gradient(222deg, rgba(255, 255, 255, 0.2) 8%, rgba(255, 255, 255, 0.08) 28%, rgba(255, 255, 255, 0) 56%),
        linear-gradient(184deg, rgba(174, 204, 230, 0.14), rgba(122, 152, 184, 0.06));
      box-shadow: inset 0 0 0 1px rgba(220, 236, 252, 0.42), inset 0 12px 22px rgba(255, 255, 255, 0.08), inset 0 -12px 20px rgba(50, 72, 98, 0.14);
    }

    #widget[data-view="lid"] #sleeveArt {
      opacity: 0;
      filter: none;
    }

    #record {
      position: absolute;
      left: -136px;
      top: 50%;
      width: 272px;
      height: 272px;
      margin-left: 0;
      margin-top: -136px;
      border-radius: 999px;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.58),
        inset 0 0 0 1px rgba(255, 255, 255, 0.18),
        inset 0 0 0 3px rgba(22, 26, 35, 0.75);
      animation: spin 11.6s linear infinite;
      animation-play-state: paused;
      z-index: 2;
      overflow: hidden;
      transition: left 620ms cubic-bezier(0.23, 1, 0.32, 1), margin-left 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #widget[data-view="lid"] #record {
      left: 50%;
      margin-left: -136px;
    }

    #record::before {
      content: none;
    }

    #record::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 104px;
      height: 104px;
      margin-left: -52px;
      margin-top: -52px;
      border-radius: 999px;
      box-shadow:
        inset 0 0 0 2px rgba(18, 24, 35, 0.45),
        inset 0 0 0 16px rgba(0, 0, 0, 0.18);
      z-index: 2;
      pointer-events: none;
    }

    #recordLabel {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 78px;
      height: 78px;
      margin-left: -39px;
      margin-top: -39px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 42%),
        linear-gradient(155deg, rgba(var(--label-base-rgb), 0.97), rgba(var(--label-ring-rgb), 0.95));
      box-shadow:
        0 0 0 1px rgba(44, 50, 63, 0.65),
        inset 0 0 0 1px rgba(255, 255, 255, 0.45);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      padding: 10px 8px;
      text-align: center;
      pointer-events: none;
      overflow: hidden;
    }

    #recordLabel::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 999px;
      background:
        radial-gradient(circle at center, rgba(var(--label-panel-rgb), 0.28), rgba(var(--label-panel-rgb), 0) 62%),
        repeating-linear-gradient(-15deg, rgba(var(--label-panel-rgb), 0.18) 0px, rgba(var(--label-panel-rgb), 0.18) 2px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0) 5px);
      box-shadow: inset 0 0 0 1px rgba(var(--label-ink-rgb), 0.35);
      pointer-events: none;
    }

    #recordLabel::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      margin-top: -4px;
      border-radius: 999px;
      background: radial-gradient(circle at 34% 34%, rgba(250, 251, 253, 0.98), rgba(152, 165, 183, 0.98));
      box-shadow: 0 0 0 1px rgba(52, 62, 79, 0.62);
      pointer-events: none;
    }

    #labelTopText,
    #labelCatalog {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(var(--label-ink-rgb), 0.9);
      font: 700 5px/1 "Segoe UI", sans-serif;
      letter-spacing: 0.45px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1;
    }

    #labelTopText { top: 8px; }
    #labelCatalog { bottom: 8px; opacity: 0.9; }

    #labelSideText {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
      transform-origin: center;
      color: rgba(var(--label-ink-rgb), 0.88);
      font: 700 5px/1 "Segoe UI", sans-serif;
      letter-spacing: 0.42px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1;
    }

    #labelTitle,
    #labelArtist {
      position: relative;
      max-width: 68%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(var(--label-ink-rgb), 0.95);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.28);
      letter-spacing: 0.3px;
      z-index: 1;
      background: rgba(var(--label-panel-rgb), 0.76);
      border-radius: 2px;
      padding: 0 2px;
    }

    #labelTitle {
      font: 700 7px/1.1 "Segoe UI", sans-serif;
      text-transform: uppercase;
    }

    #labelArtist {
      font: 700 6px/1.1 "Segoe UI", sans-serif;
      opacity: 0.94;
      text-transform: uppercase;
    }

    #recordArt {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 999px;
      filter: saturate(1.08) contrast(1.06);
    }

    #recordGrooves {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background:
        radial-gradient(circle at center, rgba(0, 0, 0, 0) 0 14%, rgba(0, 0, 0, 0.58) 42% 100%),
        repeating-radial-gradient(circle at center, rgba(255, 255, 255, 0.11) 0 1px, rgba(0, 0, 0, 0) 1px 4px);
      opacity: 0.62;
    }

    #spindle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      border-radius: 999px;
      background: rgba(245, 245, 245, 0.88);
      box-shadow: 0 0 0 1px rgba(20, 20, 20, 0.55);
      z-index: 4;
    }

    #armMount {
      position: absolute;
      left: calc(28.8% - 25px);
      bottom: 10px;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: radial-gradient(circle at 32% 32%, rgba(255, 255, 255, 0.98), rgba(176, 186, 202, 0.98) 58%, rgba(114, 125, 143, 0.98));
      box-shadow: 0 0 0 1px rgba(96, 108, 126, 0.6), 0 3px 8px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.75);
      z-index: 7;
      transition: left 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #armMount::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 13px;
      height: 13px;
      margin-left: -6.5px;
      margin-top: -6.5px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 50%, rgba(244, 249, 255, 0) 0 2.6px, rgba(244, 249, 255, 0.26) 2.6px 3.1px, rgba(66, 77, 95, 0.34) 3.1px 3.5px, rgba(235, 241, 250, 0.26) 3.5px 3.9px, rgba(70, 82, 101, 0.31) 3.9px 4.3px, rgba(0, 0, 0, 0) 4.3px),
        conic-gradient(from 208deg, rgba(86, 96, 114, 0.9), rgba(228, 236, 246, 0.9) 18%, rgba(116, 127, 145, 0.92) 36%, rgba(236, 242, 250, 0.9) 54%, rgba(107, 119, 138, 0.92) 74%, rgba(220, 229, 240, 0.9) 88%, rgba(86, 96, 114, 0.9));
      box-shadow:
        inset 0 0 0 1px rgba(246, 251, 255, 0.46),
        inset 0 1px 1px rgba(255, 255, 255, 0.54),
        inset 0 -1px 1px rgba(55, 66, 84, 0.5),
        0 0 0 1px rgba(77, 88, 106, 0.56),
        0 1px 2px rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    #armMount::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 2px;
      margin-left: -1px;
      margin-top: -4px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0));
      transform: rotate(-16deg);
      opacity: 0.56;
      pointer-events: none;
    }

    #tonearm {
      position: absolute;
      left: calc(28.8% - 11px);
      bottom: 17px;
      width: 138px;
      height: 20px;
      transform: rotate(-78deg);
      transform-origin: 0 50%;
      z-index: 6;
      pointer-events: none;
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(241, 246, 253, 0.95), rgba(170, 180, 196, 0.96) 48%, rgba(101, 113, 132, 0.98));
      clip-path: path("M0 11 C22 6, 45 6, 69 11 C91 15, 114 15, 138 11 L138 19 C114 19, 91 19, 69 16 C45 12, 22 12, 0 19 Z");
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.78),
        0 4px 8px rgba(0, 0, 0, 0.24),
        inset 0 -1px 1px rgba(36, 44, 58, 0.42);
      transition: left 620ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    #widget[data-view="lid"] #armMount {
      left: calc(14.8% - 25px);
    }

    #widget[data-view="lid"] #tonearm {
      left: calc(14.8% - 11px);
    }

    #tonearm::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 4px;
      width: 16px;
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(236, 243, 252, 0.94), rgba(132, 144, 163, 0.96));
      box-shadow: 0 0 0 1px rgba(83, 95, 114, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    #tonearm::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      top: 5px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.1));
    }

    #needle {
      position: absolute;
      right: 2px;
      top: 4px;
      width: 24px;
      height: 12px;
      border-radius: 3px;
      background:
        radial-gradient(circle at 26% 34%, rgba(112, 126, 146, 0.98) 0 1.4px, rgba(0, 0, 0, 0) 1.5px),
        radial-gradient(circle at 74% 34%, rgba(112, 126, 146, 0.98) 0 1.4px, rgba(0, 0, 0, 0) 1.5px),
        repeating-linear-gradient(90deg, rgba(151, 161, 178, 0.34) 0px, rgba(151, 161, 178, 0.34) 2px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0) 4px),
        linear-gradient(180deg, rgba(236, 241, 250, 0.92), rgba(236, 241, 250, 0) 45%),
        linear-gradient(150deg, rgba(196, 203, 215, 0.98), rgba(86, 95, 111, 0.98));
      box-shadow: 0 0 0 1px rgba(66, 74, 89, 0.62), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    #needle::before {
      content: "";
      position: absolute;
      left: 3px;
      right: 3px;
      top: 2px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(236, 242, 252, 0.95), rgba(132, 141, 157, 0.9));
    }

    #widget[data-state="active"] #record {
      animation-play-state: running;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 640px) {
      #widget { width: calc(100vw - 16px); height: calc((100vw - 16px) / 2); top: 8px; right: 8px; }
      #leftPane { padding: 10px 10px 8px 8px; }
      #title { font-size: 16px; }
      #artist { font-size: 13px; }
      #artist { margin-top: 26px; }
      #album { font-size: 11px; }
      #album { width: min(100%, 126px); max-width: 126px; }
      #frame { height: 50px; margin-top: 4px; margin-right: 34px; }
      #rightPane::before { left: -280px; width: 280px; }
      #record { width: 186px; height: 186px; margin-top: -93px; left: -93px; }
      #record::before { content: none; }
      #record::after { width: 74px; height: 74px; margin-left: -37px; margin-top: -37px; box-shadow: inset 0 0 0 2px rgba(18, 24, 35, 0.42), inset 0 0 0 11px rgba(0, 0, 0, 0.18); }
      #recordLabel { width: 54px; height: 54px; margin-left: -27px; margin-top: -27px; padding: 6px 5px; gap: 1px; }
      #recordLabel::before { inset: 4px; }
      #recordLabel::after { width: 6px; height: 6px; margin-left: -3px; margin-top: -3px; }
      #labelTopText, #labelCatalog, #labelSideText { font-size: 4px; }
      #labelTopText { top: 6px; }
      #labelCatalog { bottom: 6px; }
      #labelSideText { left: 7px; }
      #labelTitle { font-size: 5px; max-width: 70%; }
      #labelArtist { font-size: 4px; max-width: 70%; }
      #tonearm {
        width: 92px;
        height: 13px;
        left: calc(28.8% - 9px);
        bottom: 12px;
        transform: rotate(-76deg);
        clip-path: path("M0 7 C14 3, 30 3, 46 7 C62 10, 77 10, 92 7 L92 12 C77 12, 62 12, 46 10 C30 8, 14 8, 0 12 Z");
      }
      #tonearm::before { left: -5px; top: 3px; width: 12px; height: 10px; }
      #tonearm::after { left: 9px; right: 10px; top: 3px; height: 2px; }
      #armMount { width: 26px; height: 26px; left: calc(28.8% - 19px); bottom: 7px; }
      #needle { width: 18px; height: 10px; right: 1px; top: 2px; }
      #controls { margin-top: auto; }
      .knob { width: 20px; height: 20px; }
      #glassControls { height: 46px; padding: 6px 10px; gap: 8px; }
      #transport { gap: 5px; }
      #glassTransport { gap: 8px; }
      .mediaBtn { width: 20px; height: 20px; }
      .glassBtn { width: 30px; height: 30px; }
      .mediaBtn svg { width: 10px; height: 10px; }
      #glassVolumeDock { bottom: 8px; right: 8px; }
      #volumeWrap { width: 30px; height: 30px; }
      #volumePopup { width: 38px; height: 84px; bottom: calc(100% + 2px); padding: 7px 5px; }
      #sourceVolumeGlass { width: 62px; height: 16px; }
      #sourceVolumeGlass::-webkit-slider-runnable-track { height: 5px; }
      #sourceVolumeGlass::-webkit-slider-thumb { width: 10px; height: 10px; margin-top: -4px; }
      #glassMeta { left: 10px; top: 8px; max-width: 74%; }
      #glassTitle { font-size: 11px; }
      #glassArtist { font-size: 10px; }
      #glassAlbum { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="widget" data-state="idle">
    <div id="deck">
      <div id="leftPane">
        <div id="meta">
          <div id="title">Desktop audio session</div>
          <div id="album"><span id="albumText">Album unknown</span></div>
          <div id="artist">Waiting for media</div>
        </div>
        <div id="status" data-state="idle">LISTENING</div>
        <div id="controls">
          <div id="transport" aria-label="Playback controls">
            <button id="btnPrev" class="mediaBtn" type="button" aria-label="Previous track" title="Previous">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3 6 9-6v12z"/></svg>
            </button>
            <button id="btnPlayPause" class="mediaBtn" type="button" aria-label="Play or pause" title="Play">
              <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12l10-6z"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h4v12H7zm6 0h4v12h-4z"/></svg>
            </button>
            <button id="btnNext" class="mediaBtn" type="button" aria-label="Next track" title="Next">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM7 6l9 6-9 6z"/></svg>
            </button>
          </div>
          <div id="sourceKnob" class="knob" aria-hidden="true" title="Audio source"></div>
        </div>
        <div id="frame">
          <canvas id="c"></canvas>
        </div>
      </div>

      <div id="rightPane">
        <div id="record">
          <img id="recordArt" alt="Record art">
          <div id="recordGrooves"></div>
          <div id="recordLabel">
            <div id="labelTopText">Stereo 45 RPM</div>
            <div id="labelSideText">Side A</div>
            <div id="labelTitle">Unknown Track</div>
            <div id="labelArtist">Unknown Artist</div>
            <div id="labelCatalog">CAT-1029</div>
          </div>
          <div id="spindle"></div>
        </div>
        <div id="sleeve">
          <img id="sleeveArt" alt="Album sleeve art">
        </div>
      </div>

      <div id="armMount"></div>
      <div id="tonearm">
        <div id="needle"></div>
      </div>
    </div>
    <div id="glassMeta" aria-hidden="true">
      <div id="glassTitle">Unknown Track</div>
      <div id="glassArtist">Unknown Artist</div>
      <div id="glassAlbum">Album unknown</div>
    </div>
    <div id="glassControls" aria-label="Playback and volume controls">
      <div id="glassTransport" aria-label="Playback controls">
        <button id="btnPrevGlass" class="mediaBtn glassBtn" type="button" aria-label="Previous track" title="Previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3 6 9-6v12z"/></svg>
        </button>
        <button id="btnPlayPauseGlass" class="mediaBtn glassBtn" type="button" aria-label="Play or pause" title="Play">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12l10-6z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h4v12H7zm6 0h4v12h-4z"/></svg>
        </button>
        <button id="btnNextGlass" class="mediaBtn glassBtn" type="button" aria-label="Next track" title="Next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM7 6l9 6-9 6z"/></svg>
        </button>
      </div>
    </div>
    <div id="glassVolumeDock">
      <div id="volumeWrap">
        <button id="volumeBtnGlass" class="mediaBtn glassBtn" type="button" aria-label="Volume" title="Volume">
          <svg class="icon-volume" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 4V6l-4 4zM15.5 9.4a1 1 0 0 1 1.4 0 4.5 4.5 0 0 1 0 6.4 1 1 0 0 1-1.4-1.4 2.5 2.5 0 0 0 0-3.6 1 1 0 0 1 0-1.4z"/></svg>
          <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 4V6l-4 4zM15.2 9.8l4.5 4.5-1.4 1.4-4.5-4.5zm0 5.9 4.5-4.5-1.4-1.4-4.5 4.5z"/></svg>
        </button>
        <div id="volumePopup" aria-hidden="true">
          <input id="sourceVolumeGlass" type="range" min="0" max="100" step="1" value="50" aria-label="System volume" title="System volume">
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
